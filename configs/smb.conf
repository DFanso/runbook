[global]
   workgroup = WORKGROUP
   server string = Acer Media Server
   server role = standalone server
   security = user
   map to guest = never
   log file = /var/log/samba/log.%m
   max log size = 1000
   logging = file
   server min protocol = SMB2
   client min protocol = SMB2
   # Bind only to the LAN interface — avoid exposing on tunnels/hotspot/etc.
   # Replace enp4s0f1 with your actual LAN interface (`ip -4 addr`).
   interfaces = lo enp4s0f1
   bind interfaces only = yes

[media]
   comment = External media drive
   path = /mnt/media
   browseable = yes
   read only = no
   valid users = dfanso
   create mask = 0644
   directory mask = 0755
   # The NTFS mount already enforces ownership via uid=1000,gid=1000
